# Sends Fit&Sync weekly emails every Monday 7:00am Brisbane time (Sunday 21:00 UTC).
# Add repo secrets: SITE_URL (e.g. https://fitsync.com.au) and CRON_SECRET (same as your app env).
name: Weekly email
on:
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch: {}
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Process all users in batches
        run: |
          for i in $(seq 1 200); do
            res=$(curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.SITE_URL }}/api/cron/weekly")
            echo "$res"
            echo "$res" | grep -q '"done":true' && exit 0
            sleep 2
          done
