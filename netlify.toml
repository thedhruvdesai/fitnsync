[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Exercise photos never change for a given file name: cache hard to save bandwidth.
[[headers]]
  for = "/ex/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
